name: Validate Compose
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Compose
        run: docker compose version
      - name: Validate Compose config
        run: docker compose --env-file .env.example config

services:
  cashier-caddy:
    image: caddy:2.11.3-alpine
    container_name: lazy-beancount-cashier-caddy
    restart: unless-stopped
    depends_on:
      cashier-pwa:
        condition: service_started
      cashier-server:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${CASHIER_HTTP_BIND:-127.0.0.1:8080}:80"
    networks:
      - cashier

  cashier-pwa:
    image: ghcr.io/sirily/cashier-sveltekit:${PWA_VERSION:-latest}
    container_name: lazy-beancount-cashier-pwa
    restart: unless-stopped
    networks:
      - cashier
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cashier-server:
    image: ghcr.io/sirily/cashier-server-python:${SERVER_VERSION:-latest}
    container_name: lazy-beancount-cashier-server
    restart: unless-stopped
    environment:
      BEANCOUNT_FILE: /workspace/main.bean
      BEANCOUNT_MANUAL_TRANSACTIONS_FILE: /workspace/manual_transactions.bean
      CASHIER_ENABLE_SHUTDOWN: "false"
      CASHIER_CORS_ORIGINS: ${CASHIER_CORS_ORIGINS:-}
    volumes:
      - ${HOST_BEANCOUNT_WORKSPACE:?HOST_BEANCOUNT_WORKSPACE must be set in .env}:/workspace:ro
      - ${HOST_BEANCOUNT_MANUAL_TRANSACTIONS_FILE:?HOST_BEANCOUNT_MANUAL_TRANSACTIONS_FILE must be set in .env}:/workspace/manual_transactions.bean:rw
    networks:
      - cashier
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  cashier:
    # The stack can be put behind a higher-level reverse proxy by attaching
    # cashier-caddy to that proxy outside this repository (override/homelab layer).
    internal: false
